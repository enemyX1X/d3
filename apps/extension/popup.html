<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LIVIA</title>
    <style>
      body {
        width: 280px;
        margin: 0;
        padding: 14px;
        font: 13px/1.4 system-ui, sans-serif;
        background: #081018;
        color: #e9f1ff;
      }
      h1 { margin: 0 0 6px; letter-spacing: 0.2em; font-size: 16px; }
      .status { color: #7cf3ff; font-size: 11px; margin-bottom: 12px; }
      button { width: 100%; margin: 6px 0; padding: 8px; background: #121d2c; color: #e9f1ff; border: 1px solid #23364a; border-radius: 8px; cursor: pointer; }
      button:hover { border-color: #7cf3ff; }
      input { width: 100%; box-sizing: border-box; margin: 8px 0; padding: 8px; border-radius: 8px; border: 1px solid #23364a; background: #0d1723; color: #e9f1ff; }
      .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
      .message { min-height: 18px; color: #ffca7a; font-size: 11px; margin-top: 8px; }
      .note { margin: 0 0 10px; color: #92a8c5; font-size: 11px; }
    </style>
  </head>
  <body>
    <h1>LIVIA</h1>
    <div class="status">○ SITE ACCESS OFF</div>
    <p class="note">LIVIA only reads visible text on sites you enable. Page analysis stays on this device.</p>
    <p class="note">Play: aim with the reticle. Hold left click or Space for machine gun; right click or M to launch a missile.</p>
    <div class="grid">
      <button data-action="transform">Transform</button>
      <button data-action="play">Play</button>
      <button data-action="companion">Companion</button>
      <button data-action="rebuild">Rebuild</button>
    </div>
    <input id="command" placeholder='Say: "become a spaceship"' maxlength="200" />
    <button id="pause">Pause companion</button>
    <button id="site">Disable on this site</button>
    <button id="analysis">Disable page analysis</button>
    <button id="delete">Delete local data</button>
    <div class="message" id="message"></div>
    <script src="popup.js"></script>
  </body>
</html>
