services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: livia
      POSTGRES_USER: livia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-livia-local-dev-only}
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - livia-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U livia -d livia"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  livia-postgres:
